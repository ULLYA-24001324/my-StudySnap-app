name: Deploy StudySnap

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-southeast-1

      # 3. Set up Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 4. Set up AWS SAM CLI
      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # 5. SAM build
      - name: SAM build
        run: sam build --template infra/template.yaml

      # 6. SAM deploy
      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name studysnap \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      # 7. Read CloudFormation outputs and inject into frontend
      - name: Inject Lambda URLs into frontend
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name studysnap \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          DIAGRAM_URL=$(get_output DiagramApiUrl)
          sed -i "s|__DIAGRAM_API_URL__|$DIAGRAM_URL|g" frontend/index.html

          URL=$(get_output FlashcardsUrl)
          sed -i "s|__URL_FLASHCARDS__|$URL|g" frontend/index.html

          URL=$(get_output DifficultyLevelTagUrl)
          sed -i "s|__URL_DIFFICULTY_LEVEL_TAG__|$URL|g" frontend/index.html

          URL=$(get_output RealWorldExamplesUrl)
          sed -i "s|__URL_REAL_WORLD_EXAMPLES__|$URL|g" frontend/index.html

          URL=$(get_output KeyTermsGlossaryUrl)
          sed -i "s|__URL_KEY_TERMS_GLOSSARY__|$URL|g" frontend/index.html

          URL=$(get_output BulletPointSummaryUrl)
          sed -i "s|__URL_BULLET_POINT_SUMMARY__|$URL|g" frontend/index.html

          URL=$(get_output EstimatedStudyTimeUrl)
          sed -i "s|__URL_ESTIMATED_STUDY_TIME__|$URL|g" frontend/index.html

          URL=$(get_output InteractiveQuizUrl)
          sed -i "s|__URL_INTERACTIVE_QUIZ__|$URL|g" frontend/index.html

      # 8. Sync frontend to S3
      - name: Deploy frontend to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name studysnap \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)

          aws s3 sync frontend/ s3://$BUCKET \
            --cache-control no-cache \
            --delete

      # 9. Print live URL
      - name: Print website URL
        run: |
          WEBSITE_URL=$(aws cloudformation describe-stacks \
            --stack-name studysnap \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" \
            --output text)
          echo "✅ StudySnap is live at: $WEBSITE_URL"
